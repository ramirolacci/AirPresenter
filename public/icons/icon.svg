<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Stylized In-Air Hand Silhouette -->
  <g filter="url(#glow)" transform="translate(24, 22)">
    <!-- Palm & Wrist -->
    <path d="M22,76 C20,70 20,52 20,44 C20,38 28,38 28,44 L28,52 L32,52 L32,32 C32,26 40,26 40,32 L40,48 L44,48 L44,24 C44,18 52,18 52,24 L52,48 L56,48 L56,34 C56,28 64,28 64,34 L64,58 C64,74 54,82 42,82 L32,82 C26,82 23,79 22,76 Z" 
          fill="url(#cyanGlow)"/>
    <!-- Thumb pointing out -->
    <path d="M22,54 C16,50 8,56 12,64 C16,70 22,72 24,70" fill="url(#cyanGlow)"/>
  </g>

  <!-- Laser Pointer Dot with Neon Ring -->
  <circle cx="94" cy="34" r="8" fill="#FF0055" filter="url(#glow)"/>
  <circle cx="94" cy="34" r="4" fill="#FFFFFF"/>
</svg>

